name: Workload protocol probe
on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
    secrets:
      ACCEPTANCE_REGISTRY_ORIGIN:
        required: true
      ACCEPTANCE_RESOURCE_PATH:
        required: true
      ACCEPTANCE_DENIED_PATH:
        required: true
      ACCEPTANCE_SKILL_SOURCE:
        required: true
      ACCEPTANCE_SKILL_SHA256:
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.9'
      - name: Install the pinned standalone CLI
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance-cli"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 https://releases.axm.sh/cli-v0.50.1/axm-linux-x64 -o "$RUNNER_TEMP/acceptance-cli/axm"
          printf '415eea0b29138011889a4deaaa130c6204a0bbc246abe29b58500df65123adc8  %s\n' "$RUNNER_TEMP/acceptance-cli/axm" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/acceptance-cli/axm"
      - name: Verify the isolated CLI runtime
        run: |
          AXM_TELEMETRY=0 AXM_NO_UPDATE_CHECK=1 "$RUNNER_TEMP/acceptance-cli/axm" --version
          cli_check_dir="$(mktemp -d)"
          export AXM_USER_HOME="$cli_check_dir/home"
          export AXM_TELEMETRY=0
          export AXM_NO_UPDATE_CHECK=1
          cd "$cli_check_dir"
          printf '%s' '{"defaultRegistry":"diagnostic","sources":[{"name":"diagnostic","type":"registry","location":"https://example.invalid"}]}' > axm.json
          "$RUNNER_TEMP/acceptance-cli/axm" lint --json --non-interactive
      - name: Observe workload protocol boundaries
        env:
          ACCEPTANCE_PHASE: ${{ inputs.phase }}
          ACCEPTANCE_REGISTRY_ORIGIN: ${{ secrets.ACCEPTANCE_REGISTRY_ORIGIN }}
          ACCEPTANCE_RESOURCE_PATH: ${{ secrets.ACCEPTANCE_RESOURCE_PATH }}
          ACCEPTANCE_DENIED_PATH: ${{ secrets.ACCEPTANCE_DENIED_PATH }}
          ACCEPTANCE_SKILL_SOURCE: ${{ secrets.ACCEPTANCE_SKILL_SOURCE }}
          ACCEPTANCE_SKILL_SHA256: ${{ secrets.ACCEPTANCE_SKILL_SHA256 }}
        run: python scripts/probe.py
